<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SVG Indoor Map (Leaflet) - Idea Lab Floor Plan</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="Logo.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    /* page / map */
    html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }

    /* Right — floor switch + route controls */
    .right-panel {
      position: fixed;
      right: 12px;
      top: 12px;
      width: 220px;
      background: #ffffff;
      color: #d15858;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.08);
      z-index: 10000;
      box-sizing: border-box;
    }

    /* small button styles used inside panels */
    .btn {
      display:inline-block;
      margin: 4px 2px;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #cfcfcf;
      background: #f6f6f6;
      font-size: 13px;
    }

    label { display:block; font-weight:700; margin-top:6px; margin-bottom:6px; font-size:13px; color:#c44a4a; }
    select { width:100%; padding:6px; box-sizing:border-box; margin-bottom:8px; }
    .panel-button { width:100%; padding:8px; margin-top:6px; cursor:pointer; border-radius:4px; border:1px solid #bbb; background:#f0f0f0; }

    /* remove left panel entirely (you asked to remove it) */
    .left-panel { display: none; }

    /* small label style for debug node labels (optional) */
    .node-label { font-size: 12px; background: rgba(255,255,255,0.9); padding:2px 6px; border-radius:4px; border:1px solid #ddd; }

    /* responsive adjustments */
    @media (max-width: 760px) {
      .right-panel { width: 180px; right:8px; top:8px; }
    }
  </style>
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>
  
  <!-- RIGHT: Floor switch + route controls -->
  <div class="right-panel" id="floors">
    <div style="margin-bottom:8px;">
      <label><strong>Floor</strong></label>
      <button class="btn" onclick="setFloor(0)">Floor 0</button>
      <!-- add more floor buttons if needed -->
    </div>

    <hr style="border:none;border-top:1px solid #eee;margin:8px 0;">

    <label for="startSelect"><strong>Start location:</strong></label>
    <select id="startSelect">
      <option value="">-- Start --</option>
      <option value="Entry">Entry</option>
      <option value="showcase">Showcase</option>
      <option value="Mechanical Lab">Mechanical Lab</option>
      <option value="projector">Projector</option>
      <option value="Main Table">Main Table</option>
      <option value="Workspace for students">Workspace for students</option>
      <option value="Work Bench">Work Bench</option>
      <option value="CHEM LAB">CHEM LAB</option>
      <option value="open office space">Open Office Space</option>
      <option value="PCB Manufacturing LAB">PCB Manufacturing LAB</option>
      <option value="PCB Testing LAB">PCB Testing LAB</option>
      <option value="Principal Investigators room">Principal Investigators Room</option>
      <option value="MEETING ROOM">Meeting Room</option>
      <option value="3D Printing Lab">3D Printing LAB</option>
    </select>

    <label for="endSelect"><strong>Final location:</strong></label>
    <select id="endSelect">
      <option value="">-- End --</option>
      <option value="Entry">Entry</option>
      <option value="showcase">Showcase</option>
      <option value="Mechanical Lab">Mechanical Lab</option>
      <option value="projector">Projector</option>
      <option value="Main Table">Main Table</option>
      <option value="Workspace for students">Workspace for students</option>
      <option value="Work Bench">Work Bench</option>
      <option value="CHEM LAB">CHEM LAB</option>
      <option value="open office space">Open Office Space</option>
      <option value="PCB Manufacturing LAB">PCB Manufacturing LAB</option>
      <option value="PCB Testing LAB">PCB Testing LAB</option>
      <option value="Principal Investigators room">Principal Investigators Room</option>
      <option value="MEETING ROOM">Meeting Room</option>
      <option value="3D Printing Lab">3D Printing LAB</option>
    </select>

    <button id="btnFind" onclick="findRoute()" class="panel-button">Find Route</button>
    <button id="btnClear" onclick="clearRoute()" class="panel-button" style="background:#fff;margin-top:6px;">Clear</button>
  </div>

  <!-- Load Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Load your generated graph data -->
  <script src="nodes_edges.js"></script>

  <script>
  /***** Basic map + SVG overlay setup *****/
  const svgWidth = 1253;   // detected svg width (adjust if needed)
  const svgHeight = 1381; // detected svg height (adjust if needed)

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 4,
    zoomControl: true,
  });

  const bounds = [[0, 0], [svgHeight, svgWidth]];
  map.fitBounds(bounds);

  async function addSvgOverlay(svgFile) {
    const r = await fetch(svgFile);
    if (!r.ok) throw new Error('Failed to fetch ' + svgFile);
    const svgText = await r.text();
    const svgDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
    const overlay = L.imageOverlay(svgDataUrl, bounds, { interactive: true }).addTo(map);
    return overlay;
  }

  let currentOverlay = null;
  async function setFloor(n) {
    if (currentOverlay) { map.removeLayer(currentOverlay); currentOverlay = null; }
    const file = `idealab_floor_plan.svg`;
    try { currentOverlay = await addSvgOverlay(file); console.log('Loaded', file); }
    catch (e) { console.error('Failed to load svg', e); alert('Failed to load ' + file + ': ' + e); }
  }
  // initial overlay
  setFloor(0);

  /***** Load optional room->node mapping *****/
  let ROOM_TO_NODE = null;
  fetch('room_to_node.json')
    .then(r => r.ok ? r.json() : null)
    .then(m => { ROOM_TO_NODE = m || null; console.log('Loaded room_to_node.json', ROOM_TO_NODE); /* try auto-route if selects already set */ autoRouteIfPossible(); })
    .catch(err => console.log('No room_to_node.json found; fallback mapping will be used'));

  // helper: case-insensitive mapping
  function getMappedNode(roomLabel) {
    if (!ROOM_TO_NODE || !roomLabel) return null;
    const normalized = roomLabel.toLowerCase().trim();
    for (const key in ROOM_TO_NODE) {
      if (key.toLowerCase().trim() === normalized) return ROOM_TO_NODE[key];
    }
    return null;
  }

  /***** NODES + EDGES from nodes_edges.js (already loaded) *****/
  // nodes should be array {id,x,y} and edges should be [[id1,id2],...]
  if (typeof nodes === 'undefined' || typeof edges === 'undefined') {
    console.error('nodes or edges not found - make sure nodes_edges.js is loaded and defines them');
  }

  const nodeMap = {};
  if (typeof nodes !== 'undefined') nodes.forEach(n => nodeMap[n.id] = n);

  const adjacency = {};
  if (typeof nodes !== 'undefined') nodes.forEach(n => adjacency[n.id] = []);
  if (typeof edges !== 'undefined') edges.forEach(([a,b])=>{
    // edges may be node indices (numbers) or ids (strings); handle ids
    const ida = (typeof a === 'number') ? ('node' + a) : a;
    const idb = (typeof b === 'number') ? ('node' + b) : b;
    const na = nodeMap[ida], nb = nodeMap[idb];
    if (!na || !nb) return;
    const w = Math.hypot(na.x - nb.x, na.y - nb.y);
    adjacency[ida].push({ to: idb, w });
    adjacency[idb].push({ to: ida, w });
  });

  function nearestNodeToPoint(px, py){
    let best = null, bd = Infinity;
    if (typeof nodes === 'undefined') return { node: null, dist: bd };
    for (const n of nodes){
      const d = Math.hypot(n.x - px, n.y - py);
      if (d < bd){ bd = d; best = n; }
    }
    return { node: best, dist: bd };
  }

  function dijkstra(startId, goalId){
    const dist = {}, prev = {};
    if (typeof nodes === 'undefined') return null;
    const Q = new Set(nodes.map(n => n.id));
    nodes.forEach(n => { dist[n.id] = Infinity; prev[n.id] = null; });
    if (!(startId in dist) || !(goalId in dist)) return null;
    dist[startId] = 0;
    while (Q.size){
      let u = null, best = Infinity;
      Q.forEach(id => { if (dist[id] < best){ best = dist[id]; u = id; } });
      if (u === null) break;
      Q.delete(u);
      if (u === goalId) break;
      adjacency[u].forEach(edge => {
        const alt = dist[u] + edge.w;
        if (alt < dist[edge.to]){ dist[edge.to] = alt; prev[edge.to] = u; }
      });
    }
    if (dist[goalId] === Infinity) return null;
    const path = []; let cur = goalId;
    while (cur){ path.push(cur); cur = prev[cur]; }
    return path.reverse();
  }

  /***** Marker and route drawing *****/
  const marker = L.marker([svgHeight/2, svgWidth/2], { draggable: true }).addTo(map);
  marker.bindPopup('You are here').openPopup();
  function updatePosition(xPixel, yPixel) {
    const lat = yPixel;
    const lng = xPixel;
    marker.setLatLng([lat, lng]);
  }
  window.updatePosition = updatePosition;

  let routeLayer = null;
  let startPin = null;
  let endPin = null;
  function _clearRouteInternal(){
    if (routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
    if (startPin){ map.removeLayer(startPin); startPin = null; }
    if (endPin){ map.removeLayer(endPin); endPin = null; }
  }

  function drawPath(nodePath){
    _clearRouteInternal();
    if (!nodePath || nodePath.length === 0) return;
    const latlngs = nodePath.map(id => [ nodeMap[id].y, nodeMap[id].x ]);
    routeLayer = L.polyline(latlngs, { color:'#0077cc', weight:5 }).addTo(map);
    startPin = L.marker(latlngs[0]).addTo(map).bindPopup('Start: '+nodePath[0]).openPopup();
    endPin = L.marker(latlngs[nodePath.length-1]).addTo(map).bindPopup('End: '+nodePath[nodePath.length-1]);
    map.fitBounds(routeLayer.getBounds(), { padding:[20,20] });
  }

  function latlngToPixel(latlng){ return { x: latlng.lng, y: latlng.lat }; }

  /***** Auto-route wiring (maps labels -> nodes and routes immediately) *****/
  function routeByNodeIds(startNodeId, endNodeId) {
    if (!startNodeId || !endNodeId) return;
    const path = dijkstra(startNodeId, endNodeId);
    if (!path) { alert('No path found between ' + startNodeId + ' and ' + endNodeId); return; }
    drawPath(path);
  }

  function autoRouteIfPossible() {
    const sLabel = document.getElementById('startSelect').value;
    const eLabel = document.getElementById('endSelect').value;
    if (!sLabel || !eLabel) return; // no action until both selected

    // attempt mapping using room_to_node.json (case-insensitive)
    const sNode = getMappedNode(sLabel);
    const eNode = getMappedNode(eLabel);

    if (sNode && eNode) {
      routeByNodeIds(sNode, eNode);
      return;
    }

    // fallback: use click-to-assign (existing behavior) if mapping not available
    findRoute();
  }

  // attach change handlers
  document.getElementById('startSelect').addEventListener('change', autoRouteIfPossible);
  document.getElementById('endSelect').addEventListener('change', autoRouteIfPossible);

  /***** Click-driven mapping used as fallback (original behaviour) *****/
  let assignMode = null; // { startLabel, endLabel, step, startPx, endPx }
  function findRoute(){
    const s = document.getElementById('startSelect').value;
    const e = document.getElementById('endSelect').value;
    if (!s || !e){ alert('Please select both Start and End in the right panel.'); return; }

    assignMode = { startLabel: s, endLabel: e, step: 0 };
    alert('Now click ONCE on the map where "' + s + '" is located. Then click where "' + e + '" is located.');
  }

  function goFromLocation(){ /* left panel removed - not used */ }

  map.on('click', function(e){
    const px = e.latlng.lng, py = e.latlng.lat;

    if (assignMode){
      if (assignMode.step === 0){
        assignMode.startPx = { x: px, y: py };
        assignMode.step = 1;
        alert('Start mapped. Now click the map where "' + assignMode.endLabel + '" is located.');
        return;
      } else if (assignMode.step === 1){
        assignMode.endPx = { x: px, y: py };
        const sNearest = nearestNodeToPoint(assignMode.startPx.x, assignMode.startPx.y);
        const eNearest = nearestNodeToPoint(assignMode.endPx.x, assignMode.endPx.y);
        if (!sNearest.node || !eNearest.node){ alert('Could not find nearest graph nodes.'); assignMode = null; return; }
        const path = dijkstra(sNearest.node.id, eNearest.node.id);
        if (!path){ alert('No path found between selected points.'); assignMode = null; return; }
        drawPath(path);
        assignMode = null;
        return;
      }
    }

    // Normal click routing (marker -> clicked point)
    const markerPos = marker.getLatLng();
    const startPx = latlngToPixel(markerPos);
    const endPx = { x: px, y: py };
    const sNearest = nearestNodeToPoint(startPx.x, startPx.y);
    const eNearest = nearestNodeToPoint(endPx.x, endPx.y);
    if (!sNearest.node || !eNearest.node){ alert('Could not find nearest graph nodes for routing.'); return; }
    const path = dijkstra(sNearest.node.id, eNearest.node.id);
    if (!path){ alert('No path found between marker and clicked point.'); return; }
    drawPath(path);
  });

  window.findRoute = findRoute;
  window.clearRoute = _clearRouteInternal;
  window.goFromLocation = goFromLocation;

  console.log('Routing ready. Nodes:', typeof nodes !== 'undefined' ? nodes.length : 0, 'Edges:', typeof edges !== 'undefined' ? edges.length : 0);
  </script>
</body>
</html>
